export_readings:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: smgw_han
    period:
      default: custom
      selector:
        select:
          mode: dropdown
          translation_key: export_period
          options:
            - custom
            - yesterday
            - last_7_days
            - last_30_days
            - current_month
            - last_month
    from_datetime:
      selector:
        datetime:
    to_datetime:
      selector:
        datetime:
    download_cms:
      required: true
      default: false
      selector:
        boolean:
    write_csv:
      required: true
      default: false
      selector:
        boolean:
    write_xlsx:
      required: true
      default: false
      selector:
        boolean:
