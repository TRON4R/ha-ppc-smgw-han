# SMGW Datenexport – Dashboard-Kachel
# =====================================================================
# Eine Kachel mit Schnellwahl-Buttons fuer den Datenexport. Jeder Button
# startet den Export fuer einen fertigen Zeitraum und zeigt anschliessend
# eine Benachrichtigung mit anklickbaren Download-Links (CMS / CSV / Excel).
#
# VORAUSSETZUNG (einmalig):
#   Lege das Skript "SMGW Export mit Benachrichtigung" aus dem README an
#   (Einstellungen -> Automationen & Szenen -> Skripte -> "In YAML
#   bearbeiten"). Daraus ergibt sich die Entity-ID
#   script.smgw_export_mit_benachrichtigung
#   -> Falls deine abweicht, unten bei jedem "perform_action" anpassen.
#
# Ein SMGW-Geraet? Dann ist NICHTS weiter zu tun - das Geraet wird
# automatisch erkannt. Mehrere SMGWs? Dann an jeden Button eine Zeile
#   device_id: <deine-device-id>
# unter "data:" ergaenzen. Die device_id zeigt die Diagnose-Entitaet
# "Geraete-ID" am jeweiligen SMGW-Geraet (oder via Entwicklerwerkzeuge).
#
# EINBINDUNG: Dashboard -> Kachel hinzufuegen -> Manuelle Karte -> dieses
# YAML einfuegen.
# =====================================================================

type: vertical-stack
cards:
  - type: markdown
    content: >
      ## 📊 SMGW Datenexport

      Schnellauswahl eines Zeitraums. Nach dem Klick wird der Export
      erzeugt (CMS-Original + CSV + Excel); die Download-Links erscheinen
      als Benachrichtigung 🔔.

  - type: horizontal-stack
    cards:
      - type: button
        name: Gestern
        icon: mdi:calendar-arrow-left
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.smgw_export_mit_benachrichtigung
          data:
            period: yesterday
      - type: button
        name: Letzte 7 Tage
        icon: mdi:calendar-week
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.smgw_export_mit_benachrichtigung
          data:
            period: last_7_days
      - type: button
        name: Letzte 30 Tage
        icon: mdi:calendar-month
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.smgw_export_mit_benachrichtigung
          data:
            period: last_30_days

  - type: horizontal-stack
    cards:
      - type: button
        name: Aktueller Monat
        icon: mdi:calendar-today
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.smgw_export_mit_benachrichtigung
          data:
            period: current_month
      - type: button
        name: Letzter Monat
        icon: mdi:calendar-check
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.smgw_export_mit_benachrichtigung
          data:
            period: last_month
