name: Hassfest

# Home Assistant's own manifest validation. Required alongside the HACS action
# for inclusion in the HACS default repository list.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  validate:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: home-assistant/actions/hassfest@master
