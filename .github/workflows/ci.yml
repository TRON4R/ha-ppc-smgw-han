name: CI

# Pushing to a branch that has an open PR used to fire BOTH events, producing two
# identical runs per commit. Restricting `push` to main keeps full coverage with
# one run each: feature-branch pushes are covered by `pull_request`, and the
# merge/tag commit on main is covered by `push`.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Ruff
        run: ruff check custom_components tests

      - name: Pytest
        run: pytest -q

  validate:
    name: hassfest + HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
