  dedicated PV-production meter on a Modul-2 SMGW that only exposes 2.8.0).
  Only feed-in (1-0:2.8.0) rows are present; the parser/process must treat
  consumption as zero rather than failing.

  Target day 2026-05-15:
    A 00:00:01      export 500.0
    C 16 00:00:01   export 503.0   -> feed-in total = 3.0
-->
<html>
<body>
<table id="metervalue">
  <tr id="table_metervalues_line1">
    <td id="table_metervalues_col_timestamp">2026-05-16 00:00:01</td>
    <td id="table_metervalues_col_obis">1-0:2.8.0</td>
    <td id="table_metervalues_col_wert">503.0</td>
    <td id="table_metervalues_col_einheit">kWh</td>
    <td id="table_metervalues_col_status">gueltig</td>
    <td id="table_metervalues_col_istvalide">1</td>
  </tr>
  <tr id="table_metervalues_line2">
    <td id="table_metervalues_col_timestamp">2026-05-15 00:00:01</td>
    <td id="table_metervalues_col_obis">1-0:2.8.0</td>
    <td id="table_metervalues_col_wert">500.0</td>
    <td id="table_metervalues_col_einheit">kWh</td>
    <td id="table_metervalues_col_status">gueltig</td>
    <td id="table_metervalues_col_istvalide">1</td>
  </tr>
</table>
</body>
</html>
